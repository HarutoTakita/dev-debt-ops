name: Deploy (GCP)

# Build + deploy for GCP. api and service run as two separate Cloud Run services,
# so this workflow builds BOTH images (docker/api.Dockerfile and
# docker/service.Dockerfile), pushes them to Artifact Registry, then runs
# `terraform apply` against infra/gcp. Called by deploy-stg.yml / deploy-prod.yml.
#
# Naming: `environment` is the GitHub Environment (staging|production) and drives
# the WIF OIDC `environment` claim the bootstrap pool is pinned to. `tfvars_file`
# selects the Terraform environment (stg.tfvars -> environment "stg").
#
# Auth is WIF only (no long-lived keys): vars.GCP_WIF_PROVIDER + vars.GCP_DEPLOY_SA
# come from the `infra/bootstrap/gcp` outputs.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      tfvars_file:
        required: true
        type: string
    secrets:
      DB_PASSWORD:
        required: true
      SECRET_KEY:
        required: true
      # GitHub forbids the GITHUB_ prefix on secret names, so the GitHub App /
      # OAuth secrets are surfaced as GH_* and mapped to TF_VAR_github_* below.
      GH_APP_PRIVATE_KEY:
        required: true
      GH_CLIENT_SECRET:
        required: true
      GH_WEBHOOK_SECRET:
        required: false

# Serialize overlapping GCP runs against the same environment so a cancelled
# `terraform apply` can't strand the GCS state lock for a queued run.
# Cross-cloud and cross-environment runs use different groups and don't contend.
concurrency:
  group: gcp-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    # Shared by every `terraform` invocation below. Sensitive values come from
    # repo secrets and map 1:1 to infra/gcp variables. Both the targeted repo
    # apply and the full apply need these (Terraform resolves all declared
    # variables regardless of -target).
    env:
      TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
      TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
      TFVARS_FILE: ${{ inputs.tfvars_file }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra/gcp
        run: terraform init

      # The Artifact Registry repository is owned by this Terraform stack, so
      # create it FIRST (idempotent no-op after the first deploy). This avoids the
      # chicken-and-egg where the full apply would wire Cloud Run to images that
      # haven't been pushed yet. -target prunes to the repo + its API-enable dep.
      - name: Ensure Artifact Registry repository
        working-directory: infra/gcp
        run: |
          terraform apply -auto-approve \
            -var-file="environments/${TFVARS_FILE}" \
            -target=google_artifact_registry_repository.main

      - name: Compute image references
        id: refs
        working-directory: infra/gcp
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          REGION="${REGION:-asia-northeast1}"
          # artifact_registry_repo output is the full resource name
          # (projects/<p>/locations/<r>/repositories/<repo_id>); take the repo_id.
          REPO="$(terraform output -raw artifact_registry_repo | sed 's#.*/##')"
          HOST="${REGION}-docker.pkg.dev"
          {
            echo "host=${HOST}"
            echo "api_image=${HOST}/${PROJECT}/${REPO}/api:${IMAGE_TAG}"
            echo "service_image=${HOST}/${PROJECT}/${REPO}/service:${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.refs.outputs.host }}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # api bakes the SPA and runs `alembic upgrade head` on boot
      # (docker/api.Dockerfile, default runtime stage).
      - name: Build and push api image
        env:
          API_IMAGE: ${{ steps.refs.outputs.api_image }}
        run: |
          docker buildx build \
            --file docker/api.Dockerfile \
            --tag "$API_IMAGE" \
            --cache-from type=gha,scope=gcp-api \
            --cache-to type=gha,mode=max,scope=gcp-api \
            --push \
            .

      - name: Build and push service image
        env:
          SERVICE_IMAGE: ${{ steps.refs.outputs.service_image }}
        run: |
          docker buildx build \
            --file docker/service.Dockerfile \
            --tag "$SERVICE_IMAGE" \
            --cache-from type=gha,scope=gcp-service \
            --cache-to type=gha,mode=max,scope=gcp-service \
            --push \
            .

      # Block CRITICAL/HIGH CVEs before either image reaches Cloud Run. The image
      # is already in the registry but never wired into a live revision until the
      # full apply below.
      - name: Scan api image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.api_image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          vuln-type: os,library
          ignore-unfixed: true

      - name: Scan service image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.service_image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          vuln-type: os,library
          ignore-unfixed: true
          # 第三者コンポーネント（upstream Go バイナリ + ツール同梱の推移的 Node/Python 依存）の
          # 修正不可 HIGH を根拠付きで許容（.trivyignore に CVE-ID と理由を明記）。
          trivyignores: .trivyignore

      # ── Blue/green (staged canary) rollout (issue 072) ──────────────────────
      # Migrations are NO LONGER run on api boot. Instead: (1) update the migrate
      # Cloud Run Job to the new image via a targeted apply, (2) execute it to apply
      # the (expand-only, backward-compatible) migration BEFORE any new revision
      # serves, (3) deploy the new api revision (green) at 0% and shift traffic
      # 0→10→100 with a health gate + instant rollback, (4) full apply to reconcile
      # the worker + LB + monitoring (the api service ignores image/traffic changes,
      # so Terraform never fights the gcloud-managed revision/traffic).

      # (1) Ensure the migrate Job exists on the freshly pushed api image.
      - name: Update migrate Job
        working-directory: infra/gcp
        env:
          TF_VAR_container_image_api: ${{ steps.refs.outputs.api_image }}
          TF_VAR_container_image_service: ${{ steps.refs.outputs.service_image }}
        run: |
          # migrate Job は secret の「コンテナ」にしか依存しない（version="latest" は実行時解決）。
          # cold-start では secret の「バージョン」が未作成のまま Job を作ろうとして
          # "secrets/.../versions/latest was not found" で失敗するため、バージョンも同時に target する
          # （version → container → Cloud SQL の順で作成される。db-url の値は SQL 接続名に依存）。
          terraform apply -auto-approve \
            -var-file="environments/${TFVARS_FILE}" \
            -target=google_secret_manager_secret_version.secrets \
            -target=google_project_iam_member.runtime_cloudsql \
            -target=google_cloud_run_v2_job.migrate

      # (2) Run DB migrations as a one-off, waiting for completion. Fails the deploy
      # if the migration errors (nothing has been cut over yet, so blue is untouched).
      - name: Run DB migrations (Cloud Run Job)
        working-directory: infra/gcp
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          REGION="${REGION:-asia-northeast1}"
          JOB="$(terraform output -raw migrate_job_name)"
          gcloud run jobs execute "$JOB" --region "$REGION" --wait

      # (3) Canary: deploy green at 0%, then shift 10% → (health) → 100% via the LB.
      # Rolls back to the previously-serving revision on any health failure.
      - name: Deploy api (staged canary)
        working-directory: infra/gcp
        env:
          REGION: ${{ vars.GCP_REGION }}
          API_IMAGE: ${{ steps.refs.outputs.api_image }}
          APP_URL_OVERRIDE: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          REGION="${REGION:-asia-northeast1}"
          # Cold start: the api service is not in Terraform state / Cloud Run yet
          # (only the migrate Job + its deps were applied above). The canary shifts
          # traffic on an ALREADY-serving service, so on a fresh environment skip it
          # and let the reconcile apply below create the api at 100% with the pushed
          # image (`ignore_changes=[image,traffic]` still honours the initial value on
          # create). Canary applies only when updating an existing service.
          API="$(terraform output -raw api_service_name 2>/dev/null || true)"
          if [ -z "$API" ] || ! gcloud run services describe "$API" --region "$REGION" >/dev/null 2>&1; then
            echo "::notice::api service not found (cold start) — skipping canary; the reconcile apply will create it."
            exit 0
          fi

          # Health-check URL: LB HTTPS endpoint (vars.APP_URL or api_url when it's https).
          URL="$APP_URL_OVERRIDE"
          [ -n "$URL" ] || URL="$(terraform output -raw api_url)"
          check() {
            case "$URL" in
              https://*) curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${URL}/api/v1/health" > /dev/null ;;
              *) echo "::warning::No HTTPS endpoint (api_url=$URL); skipping health gate." ;;
            esac
          }

          # Remember the currently-serving revision for rollback.
          OLD_REVISION="$(gcloud run revisions list --service "$API" --region "$REGION" \
            --sort-by='~metadata.creationTimestamp' --limit=1 --format='value(metadata.name)' || true)"
          echo "current revision: ${OLD_REVISION:-<none>}"

          rollback() {
            echo "::error::canary health check failed — rolling back"
            if [ -n "$OLD_REVISION" ]; then
              gcloud run services update-traffic "$API" --region "$REGION" --to-revisions "${OLD_REVISION}=100"
            fi
            exit 1
          }

          # Deploy green at 0% traffic (tagged). Inherits all other config from the
          # service (Terraform-owned); only the image changes.
          gcloud run deploy "$API" --region "$REGION" --image "$API_IMAGE" --no-traffic --tag green --quiet

          # 10% → health → 100%. Old revision retained for instant rollback.
          gcloud run services update-traffic "$API" --region "$REGION" --to-tags green=10 --quiet
          check || rollback
          sleep 20
          check || rollback
          gcloud run services update-traffic "$API" --region "$REGION" --to-tags green=100 --quiet
          check || rollback

      # (4) Reconcile the rest (worker image, LB, monitoring, ...). api image/traffic
      # are ignore_changes so this does not disturb the canary cutover above.
      - name: Terraform Apply (reconcile)
        working-directory: infra/gcp
        env:
          TF_VAR_container_image_api: ${{ steps.refs.outputs.api_image }}
          TF_VAR_container_image_service: ${{ steps.refs.outputs.service_image }}
        run: |
          terraform apply -auto-approve -var-file="environments/${TFVARS_FILE}"

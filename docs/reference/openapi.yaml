      description: "A feature's function-level graph (Level-2, issue 282) — lazily fetched on feature\
        \ click.\n\nFiles become cluster \"hub\" nodes, functions their children (``CONTAINS`` edges),\
        \ connected by\nfunction ``CALLS`` (intra- and cross-file, within the feature's files). This gives\
        \ the dense,\nconnected structure of the CodeGraphContext view and guarantees no function floats\
        \ disconnected.\n\n- ``nodes``: ``{id, label, file, kind}`` where ``kind`` is ``\"file\"`` (hub)\
        \ or ``\"function\"``;\n  ``id`` is composite (``\"file::<path>\"`` / ``\"<file>::<name>\"``)\
        \ to avoid same-name collisions.\n- ``edges``: ``{source, target, type}`` where ``type`` is ``\"\
        contains\"`` or ``\"calls\"``.\n- ``truncated``: ``true`` when the node cap dropped some functions\
        \ (no silent truncation).\n``observed=false`` when no graph / feature-clustering run is available."

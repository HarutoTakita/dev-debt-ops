openapi: 3.1.0
info:
  title: DevDebtOps
  summary: Tech Debt Twin Agent — SvelteKit + FastAPI + PostgreSQL
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      - Health
      summary: Liveness check
      description: 'Liveness probe: the process is alive and serving requests.


        Dependency-free and instant by design — it does **not** touch the database. Use

        ``/health/ready`` for a deep readiness check.'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Service is accepting traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/ready:
    get:
      tags:
      - Health
      - Health
      summary: Readiness check
      description: 'Readiness probe: verify the database is reachable and report memory + uptime.


        Runs ``SELECT 1`` and measures its latency. If the database check fails the endpoint returns

        ``503`` (overall status ``degraded``) so the orchestrator/LB can stop routing traffic here.'
      operationId: readiness_check_api_v1_health_ready_get
      responses:
        '200':
          description: Dependency and resource health for this replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A critical dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/config:
    get:
      tags:
      - Config
      summary: Public runtime config / feature flags
      description: Return feature flags the frontend needs before login (e.g. whether to show the demo
        button).
      operationId: get_public_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Authenticate credentials, set access + refresh cookies, fire on_after_login.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: 'Rotate the refresh token. On reuse (revoked jti replayed), revoke the entire family.


        Runs the rotation as a single transaction with `SELECT ... FOR UPDATE` on the

        incoming token''s row. The `refresh_strategy` dep is kept in the signature to keep

        the FastAPI dependency graph consistent with `/login`, but rotation writes go

        through the session directly so that reuse-detection, row-update, and new-row

        insert are atomic.'
      operationId: refresh_api_v1_auth_refresh_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: 'Revoke the current refresh-token row, bump `users.token_epoch`, clear both cookies.


        Idempotent: returns 204 even if no cookies are present. The epoch bump

        invalidates any still-valid access JWTs for the user (ASVS 3.3.1),

        closing the post-logout window where a stale cookie would otherwise work.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register:Register
      operationId: register_register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                REGISTER_USER_ALREADY_EXISTS:
                  summary: A user with this email already exists.
                  value:
                    detail: REGISTER_USER_ALREADY_EXISTS
                REGISTER_INVALID_PASSWORD:
                  summary: Password validation failed.
                  value:
                    detail:
                      code: REGISTER_INVALID_PASSWORD
                      reason: Password should beat least 3 characters
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: List users
      description: 'Return all users ordered by creation date, newest first.


        `q` performs a case-insensitive substring match against both `email` and

        `display_name` — rows matching either field are included. Use `limit` and

        `offset` for cursor-free pagination.'
      operationId: list_users_api_v1_users_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Substring filter applied case-insensitively to email and display_name.
          title: Q
        description: Substring filter applied case-insensitively to email and display_name.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          description: Maximum number of users to return (capped at 500).
          default: 100
          title: Limit
        description: Maximum number of users to return (capped at 500).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of users to skip before returning results.
          default: 0
          title: Offset
        description: Number of users to skip before returning results.
      responses:
        '200':
          description: Paginated list of users (newest first, optionally filtered by email/display_name).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRead'
                title: Response List Users Api V1 Users Get
        '401':
          description: Not authenticated.
        '403':
          description: Caller is not a superuser.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/activity:
    get:
      tags:
      - users
      summary: List members with operational activity
      description: 'Return members with their aggregated activity across all projects.


        Superusers get the real aggregation; the guest-demo user gets fabricated sample members (so the

        admin dashboard is demoable without exposing any real account). Everyone else is forbidden.


        Aggregates are computed with a handful of grouped queries (one per metric family) rather than

        per-user loops, then joined in Python — so the response stays O(1) queries regardless of member

        count. Metrics: learning-plan step progress, quiz completion + average score, repayment-PR and

        GitHub-issue creation counts, and last activity.'
      operationId: list_user_activity_api_v1_users_activity_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Substring filter applied case-insensitively to email and display_name.
          title: Q
        description: Substring filter applied case-insensitively to email and display_name.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          description: Maximum number of members to return (capped at 500).
          default: 200
          title: Limit
        description: Maximum number of members to return (capped at 500).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of members to skip before returning results.
          default: 0
          title: Offset
        description: Number of members to skip before returning results.
      responses:
        '200':
          description: Per-member activity for the admin dashboard (learning / quiz / PR / issue / last
            active).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserActivityOut'
                title: Response List User Activity Api V1 Users Activity Get
        '401':
          description: Not authenticated.
        '403':
          description: Caller is not a superuser.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/role:
    patch:
      tags:
      - users
      summary: Promote or demote a user
      description: "Promote or demote a user between the `admin` and `user` roles.\n\nSets `is_superuser`\
        \ on the target user: `role='admin'` grants it,\n`role='user'` revokes it. A self-demotion guard\
        \ prevents the calling\nsuperuser from removing their own admin privileges. The `role` field\n\
        is validated server-side by Pydantic via `UserRoleUpdate`.\n\nRaises:\n    NotFoundError: If no\
        \ user with `user_id` exists.\n    BadRequestError: If the calling superuser attempts to demote\
        \ themselves."
      operationId: set_user_role_api_v1_users__user_id__role_patch
      security:
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: UUID of the user whose role is changing.
          title: User Id
        description: UUID of the user whose role is changing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Updated user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Superuser attempted to demote themselves.
        '404':
          description: User not found.
        '401':
          description: Not authenticated.
        '403':
          description: Caller is not a superuser.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/credits:
    post:
      tags:
      - users
      summary: Grant analysis credits to a user
      description: "Add ``amount`` repository-analysis credits to a user's balance (superuser only, issue\
        \ 298).\n\nThis is the manual top-up path (a future admin screen will call it). Credits start\
        \ at 0, so a\nuser cannot run analysis until an admin grants some (when ``ANALYSIS_CREDITS_ENABLED``).\n\
        \nRaises:\n    NotFoundError: If no user with ``user_id`` exists."
      operationId: grant_user_credits_api_v1_users__user_id__credits_post
      security:
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: UUID of the user receiving credits.
          title: User Id
        description: UUID of the user receiving credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreditsGrant'
      responses:
        '200':
          description: Updated user record with the new balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '404':
          description: User not found.
        '401':
          description: Not authenticated.
        '403':
          description: Caller is not a superuser.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: Users:Current User
      operationId: users_current_user_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Missing token or inactive user.
      security:
      - APIKeyCookie: []
    patch:
      tags:
      - users
      summary: Users:Patch Current User
      operationId: users_patch_current_user_api_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Missing token or inactive user.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                UPDATE_USER_EMAIL_ALREADY_EXISTS:
                  summary: A user with this email already exists.
                  value:
                    detail: UPDATE_USER_EMAIL_ALREADY_EXISTS
                UPDATE_USER_INVALID_PASSWORD:
                  summary: Password validation failed.
                  value:
                    detail:
                      code: UPDATE_USER_INVALID_PASSWORD
                      reason: Password should beat least 3 characters
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyCookie: []
  /api/v1/users/{id}:
    get:
      tags:
      - users
      summary: Users:User
      operationId: users_user_api_v1_users__id__get
      security:
      - APIKeyCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Missing token or inactive user.
        '403':
          description: Not a superuser.
        '404':
          description: The user does not exist.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - users
      summary: Users:Patch User
      operationId: users_patch_user_api_v1_users__id__patch
      security:
      - APIKeyCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Missing token or inactive user.
        '403':
          description: Not a superuser.
        '404':
          description: The user does not exist.
        '400':
          content:
            application/json:
              examples:
                UPDATE_USER_EMAIL_ALREADY_EXISTS:
                  summary: A user with this email already exists.
                  value:
                    detail: UPDATE_USER_EMAIL_ALREADY_EXISTS
                UPDATE_USER_INVALID_PASSWORD:
                  summary: Password validation failed.
                  value:
                    detail:
                      code: UPDATE_USER_INVALID_PASSWORD
                      reason: Password should beat least 3 characters
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Users:Delete User
      operationId: users_delete_user_api_v1_users__id__delete
      security:
      - APIKeyCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing token or inactive user.
        '403':
          description: Not a superuser.
        '404':
          description: The user does not exist.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs:
    get:
      tags:
      - orgs
      summary: List my orgs
      description: 'Return all orgs the caller belongs to.


        Only orgs where the caller holds an active (non-soft-deleted) membership are included.

        Soft-deleted orgs and soft-deleted memberships are filtered out.'
      operationId: list_my_orgs_api_v1_orgs_get
      responses:
        '200':
          description: Every active org the caller is an active member of.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrgRead'
                type: array
                title: Response List My Orgs Api V1 Orgs Get
        '401':
          description: Not authenticated.
      security:
      - APIKeyCookie: []
    post:
      tags:
      - orgs
      summary: Create an organization
      description: "Create a new organization owned by the caller.\n\nThe caller is automatically added\
        \ as the first `OWNER` member of the new org.\nSlug uniqueness is enforced among non-deleted orgs\
        \ via the `uq_orgs_slug_active`\npartial unique index.\n\nRaises:\n    ConflictError: If the slug\
        \ is already in use by a non-deleted org."
      operationId: create_org_api_v1_orgs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
        required: true
      responses:
        '201':
          description: The newly created org, with the caller as its first owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgRead'
        '401':
          description: Not authenticated.
        '409':
          description: Slug already in use.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyCookie: []
  /api/v1/orgs/{slug}:
    get:
      tags:
      - orgs
      summary: Get an organization
      description: "Return the org row for the given slug.\n\nRaises:\n    NotFoundError: If no active\
        \ org with the given slug exists.\n    PermissionDeniedError: If the caller is not an active member."
      operationId: get_org_api_v1_orgs__slug__get
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      responses:
        '200':
          description: Org metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgRead'
        '401':
          description: Not authenticated.
        '403':
          description: Not a member of this org.
        '404':
          description: Org not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - orgs
      summary: Update org metadata
      description: "Patch mutable fields on the org. Currently only the `name` field is mutable (see `OrgUpdate`).\n\
        \nRaises:\n    NotFoundError: If no active org with the given slug exists.\n    PermissionDeniedError:\
        \ If the caller is not an admin of this org."
      operationId: update_org_api_v1_orgs__slug__patch
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUpdate'
      responses:
        '200':
          description: Updated org record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgRead'
        '401':
          description: Not authenticated.
        '403':
          description: Not an admin of this org.
        '404':
          description: Org not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - orgs
      summary: Delete an organization
      description: "Soft-delete the org and cascade to all of its member rows.\n\nPersonal orgs cannot\
        \ be deleted.\n\nRaises:\n    NotFoundError: If no active org with the given slug exists.\n  \
        \  PermissionDeniedError: If the caller is not an owner, or the org is personal."
      operationId: delete_org_api_v1_orgs__slug__delete
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      responses:
        '204':
          description: Org and all of its memberships are soft-deleted.
        '401':
          description: Not authenticated.
        '403':
          description: Not an owner, or org is personal.
        '404':
          description: Org not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{slug}/members:
    get:
      tags:
      - orgs
      summary: List org members
      description: "Return all active memberships for the org, each nested with the user's display data.\n\
        \nRaises:\n    NotFoundError: If no active org with the given slug exists.\n    PermissionDeniedError:\
        \ If the caller is not an active member."
      operationId: list_members_api_v1_orgs__slug__members_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      responses:
        '200':
          description: Every active member of the org, each nested with a user summary.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMemberRead'
                title: Response List Members Api V1 Orgs  Slug  Members Get
        '401':
          description: Not authenticated.
        '403':
          description: Not a member of this org.
        '404':
          description: Org not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - orgs
      summary: Invite a user to the org
      description: "Look up a user by email and add them to the org with MEMBER role.\n\nPersonal orgs\
        \ cannot invite additional members.\n\nRaises:\n    NotFoundError: If no user exists with the\
        \ given email, or the org is not found.\n    PermissionDeniedError: If the caller is not an admin,\
        \ or the org is personal.\n    ConflictError: If the user is already an active member of the org."
      operationId: invite_member_api_v1_orgs__slug__members_post
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMemberInvite'
      responses:
        '201':
          description: The newly created MEMBER record, nested with the user's summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberRead'
        '401':
          description: Not authenticated.
        '403':
          description: Not an admin, or org is personal.
        '404':
          description: Org or invited user not found.
        '409':
          description: User is already an active member.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{slug}/me:
    get:
      tags:
      - orgs
      summary: Get my membership in this org
      description: "Return the caller's own membership row in this org.\n\nRaises:\n    NotFoundError:\
        \ If no active org with the given slug exists.\n    PermissionDeniedError: If the caller is not\
        \ an active member."
      operationId: get_my_membership_api_v1_orgs__slug__me_get
      security:
      - APIKeyCookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Org slug
          title: Slug
        description: Org slug
      responses:
        '200':
          description: Caller's own membership record, nested with their user summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberRead'
        '401':
          description: Not authenticated.
        '403':
          description: Not a member of this org.
        '404':
          description: Org not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{slug}/members/me:
    delete:
      tags:
      - orgs
      summary: Leave an organization
      description: "Remove the caller from the org by soft-deleting their membership.\n\nThe request is\
        \ refused if the org is a personal org, or if the caller is\nthe last owner — in that case, transfer\
